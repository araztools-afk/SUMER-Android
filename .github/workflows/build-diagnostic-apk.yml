name: Build S1 Android APK

on:
  push:
    branches: [ s1 ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Accept Android SDK licenses and install packages
        run: |
          yes | sdkmanager --licenses >/dev/null
          sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Install Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build S1 debug APK
        run: gradle --no-daemon clean :app:assembleDebug

      - name: Verify S1 APK package metadata and signature
        run: |
          APK="app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK"
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$APK" | tee apk-badging.txt
          grep -q "package: name='com.araztools.s1'" apk-badging.txt
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose "$APK"
          sha256sum "$APK" | tee apk-sha256.txt
          cp "$APK" S1.apk

      - name: Upload verified S1 APK
        uses: actions/upload-artifact@v4
        with:
          name: S1-Android-APK
          path: |
            S1.apk
            apk-badging.txt
            apk-sha256.txt
          if-no-files-found: error
          retention-days: 14
